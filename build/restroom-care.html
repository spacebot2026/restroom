<title>화장실 불편접수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9ECE6; --surface-3:#DCE0D9; --line:#D3D8D0;
  --text:#18222F; --muted:#5C6674; --faint:#8A939E;
  --signal:#F2B01E; --signal-ink:#1A1400; --signal-soft:#FBEBC2;
  --new:#D4443A; --going:#2A70C2; --done:#2C8A5F; --warn:#B97205; --sos:#B3261E;
  --new-bg:#FBE7E4; --going-bg:#E4EEF9; --done-bg:#E3F2EA; --warn-bg:#FCEFD6;
  --edit:#FFE36E; --edit-ink:#3A2E00;
  --dev:#23272D;
  --shadow:0 1px 2px rgba(24,34,47,.06),0 10px 28px rgba(24,34,47,.10);
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  /* 벽 태블릿·QR 화면은 기기 안 화면이라 테마와 무관하게 고정 */
  --k-bg:#111A26; --k-rail:#0B121B; --k-tile:#1B2634; --k-tile-hi:#243349; --k-line:#2B3A4D; --k-text:#F1F2EC; --k-muted:#93A0B0; --k-amber:#F2B01E;
  --ph:clamp(520px, calc(100vh - 150px), 690px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E141C; --surface:#161F2A; --surface-2:#1D2835; --surface-3:#2A384A; --line:#2A3746;
    --text:#E5E9ED; --muted:#9AA5B2; --faint:#6E7A88; --signal-soft:#3A2F12;
    --new:#EF6A5F; --going:#5B9BE6; --done:#47B27F; --warn:#E3A33B;
    --new-bg:rgba(212,68,58,.18); --going-bg:rgba(42,112,194,.22); --done-bg:rgba(44,138,95,.2); --warn-bg:rgba(201,125,6,.2);
    --dev:#050709; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E141C; --surface:#161F2A; --surface-2:#1D2835; --surface-3:#2A384A; --line:#2A3746;
  --text:#E5E9ED; --muted:#9AA5B2; --faint:#6E7A88; --signal-soft:#3A2F12;
  --new:#EF6A5F; --going:#5B9BE6; --done:#47B27F; --warn:#E3A33B;
  --new-bg:rgba(212,68,58,.18); --going-bg:rgba(42,112,194,.22); --done-bg:rgba(44,138,95,.2); --warn-bg:rgba(201,125,6,.2);
  --dev:#050709; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--going);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
.hint{color:var(--muted);font-size:12px}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- 상단 ---------- */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{font:700 11px/1 var(--mono);letter-spacing:.16em;background:var(--text);color:var(--surface);padding:7px 7px 6px 8px;border-radius:4px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{display:block;font:500 11px/1.3 var(--mono);color:var(--muted)}
.roles{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.roles::-webkit-scrollbar{display:none}
.role{display:flex;align-items:center;gap:2px;flex:none}
.role>button:not(.pen){border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.role>button:not(.pen):hover{background:var(--surface-2);color:var(--text)}
.role>button[aria-current="true"]{background:var(--text);color:var(--surface)}
.top-actions{display:flex;align-items:center;gap:12px;flex:none;margin-left:auto}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:21px;background:var(--surface-3);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked{background:var(--signal)}
.switch input:checked::after{transform:translateX(15px)}
@media (max-width:760px){.roles{order:3;flex-basis:100%}}

.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 16px;background:var(--edit);color:var(--edit-ink);border-bottom:1px solid rgba(0,0,0,.14);font-size:13px}
.editbar b{font-weight:700}
.editbar .eb-store{font-size:12px;opacity:.8}
.editbar button{border:1px solid rgba(58,46,0,.28);background:rgba(255,255,255,.6);color:var(--edit-ink);padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:500}
.editbar button:hover{background:#fff}

.pen{display:none;flex:none;width:22px;height:22px;border-radius:6px;border:1px solid #C9A400;background:var(--edit);color:var(--edit-ink);font-size:12px;line-height:1;padding:0;align-items:center;justify-content:center;font-family:var(--font);vertical-align:middle}
body.editing .pen{display:inline-flex}
body:not(.editing) .is-hid{display:none!important}
body.editing .is-hid{opacity:.42;outline:1px dashed var(--muted);outline-offset:1px}
.help{display:block;font-size:11.5px;color:var(--muted);font-weight:400}

/* ---------- 공용 ---------- */
.b{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.b:hover{background:var(--surface-2)}
.b .ico{width:16px;height:16px}
.b.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.b.accent{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);font-weight:600}
.b.danger{color:var(--new);border-color:var(--new)}
.b.ghost{background:transparent}
.b:disabled{opacity:.45}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.5}
.chip.new{background:var(--new-bg);color:var(--new)}
.chip.going{background:var(--going-bg);color:var(--going)}
.chip.done{background:var(--done-bg);color:var(--done)}
.chip.sos{background:var(--sos);color:#fff}
.chip.cancel{background:var(--surface-2);color:var(--muted)}
.chip.rep{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.fld{display:grid;gap:5px;min-width:0}
.fld .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.fld select,.fld textarea,.fld input[type=text]{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:8px 10px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.dnotes{margin:0;padding:14px 16px 14px 32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:6px;font-size:13px;color:var(--muted);max-width:62ch}
.dnotes b{color:var(--text)}
.dnotes-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 -4px}

/* ---------- 무대 배치 ---------- */
main{padding-inline:16px;padding-block:16px 40px}
.ov{display:grid;grid-template-columns:minmax(0,1.6fr) 352px minmax(260px,1fr);gap:20px;align-items:start}
.ov-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.cap{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cap b{color:var(--text);font-size:13px}
@media (max-width:1200px){.ov{grid-template-columns:minmax(0,1fr) 352px}.ov-col.adm-live{grid-column:1/-1}}
@media (max-width:760px){.ov{grid-template-columns:minmax(0,1fr)}}
.dev-tablet{background:var(--dev);border-radius:26px;padding:16px;box-shadow:var(--shadow);width:100%}
.dev-phone{flex:none;width:352px;max-width:100%;background:var(--dev);border-radius:44px;padding:12px;box-shadow:var(--shadow)}
.pscreen{position:relative;border-radius:32px;overflow:hidden;height:var(--ph);background:var(--ground);display:flex;flex-direction:column}
.solo{display:flex;flex-direction:column;align-items:center;gap:12px}
.solo-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.solo-bar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;margin-left:6px}
.solo .dev-tablet{width:min(100%,1040px,calc((100vh - 170px) * 1.333 + 32px))}
.split{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
.side{display:flex;flex-direction:column;gap:14px;width:min(100%,440px)}

/* ---------- 벽 태블릿 (고객) ---------- */
.kscreen{container-type:inline-size;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:var(--k-bg)}
.kiosk{height:100%;display:grid;grid-template-columns:31% minmax(0,1fr);color:var(--k-text);font-family:var(--font)}
.k-rail{background:var(--k-rail);display:flex;flex-direction:column;padding:4cqw 3cqw 3cqw;gap:1.1cqw;min-height:0}
.k-sign{display:flex;align-items:center;gap:2cqw}
.k-floor{background:var(--k-amber);color:#15110A;font:700 6.4cqw/1 var(--mono);padding:1.3cqw 1.7cqw 1.1cqw;border-radius:1cqw;letter-spacing:-.03em}
.k-pict{width:7.5cqw;height:7.5cqw;color:var(--k-text)}
.k-pict .ico{width:100%;height:100%}
.k-roomname{font-weight:700;font-size:3.5cqw;line-height:1.25;margin-top:1.6cqw}
.k-bldg{font-size:1.7cqw;color:var(--k-muted)}
.k-stat{margin-top:auto;border-top:1px solid var(--k-line);padding-top:1.6cqw;font-size:1.75cqw;color:var(--k-muted);line-height:1.5}
.k-stat b{color:var(--k-text);font-family:var(--mono);font-size:2.3cqw}
.k-rail-actions{display:grid;gap:1.2cqw}
.k-cell{position:relative;min-height:0;min-width:0}
.k-cell>.pen{position:absolute;top:.7cqw;right:.7cqw;z-index:3}
.k-clean,.k-sos{width:100%;display:flex;align-items:center;gap:1.4cqw;border-radius:1.4cqw;padding:1.6cqw 1.8cqw;font-size:2.1cqw;font-weight:600;text-align:left;border:1px solid var(--k-line);background:var(--k-tile);color:var(--k-text);position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.k-clean .ico,.k-sos .ico{width:3.6cqw;height:3.6cqw}
.k-clean .ico{color:#7FD1A6}
.k-sos{background:#3A1413;border-color:#6B2320;color:#FFD9D5}
.k-sos small,.qa-sos small{display:block;font-size:1.55cqw;font-weight:500;opacity:.8}
.k-sos-fill{position:absolute;inset:0;background:#B3261E;transform-origin:left center;transform:scaleX(0);z-index:0;pointer-events:none}
.k-sos>*:not(.k-sos-fill),.qa-sos>*:not(.k-sos-fill){position:relative;z-index:1}
.holding .k-sos-fill{transform:scaleX(1);transition:transform 2s linear}
.k-main{display:flex;flex-direction:column;padding:3.2cqw 3.2cqw 3cqw;min-height:0;gap:1.8cqw;min-width:0}
.k-top{display:flex;align-items:center;gap:2cqw;min-height:4.6cqw}
.k-q{margin:0;font-size:3.4cqw;font-weight:700;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:1cqw;line-height:1.25}
.k-main>.k-q{flex:none}
.k-lang{display:flex;gap:.6cqw}
.k-lang button{border:1px solid var(--k-line);background:none;color:var(--k-muted);font-size:1.55cqw;padding:.6cqw 1.1cqw;border-radius:.8cqw;font-weight:600}
.k-lang button[aria-pressed="true"]{background:var(--k-text);color:var(--k-bg);border-color:var(--k-text)}
.k-grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:1.4cqw;min-height:0}
.k-tile{width:100%;height:100%;border:1px solid var(--k-line);background:var(--k-tile);color:var(--k-text);border-radius:1.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;padding:1cqw;transition:background .12s,transform .08s}
.k-tile:hover{background:var(--k-tile-hi)}
.k-tile:active{transform:scale(.97)}
.k-tile .ico{width:6cqw;height:6cqw;color:var(--k-amber)}
.k-tile span{font-size:2.15cqw;font-weight:600;text-align:center;line-height:1.25}
.k-tile small{font-size:1.4cqw;color:var(--k-muted);font-weight:400;text-align:center}
.k-back{background:none;border:0;color:var(--k-muted);font-size:1.8cqw;padding:.5cqw 0;font-weight:500}
.k-picked{display:flex;align-items:center;gap:1cqw;font-size:2cqw;font-weight:600;background:var(--k-tile);border-radius:3cqw;padding:.8cqw 1.8cqw .8cqw 1.2cqw;margin-left:auto}
.k-picked .ico{width:3cqw;height:3cqw;color:var(--k-amber)}
.k-stalls{flex:1;display:flex;align-items:stretch;justify-content:center;gap:1.6cqw;min-height:0;padding:.6cqw 0}
.k-door{flex:0 1 11cqw;border:2px solid var(--k-line);background:var(--k-tile);color:var(--k-text);border-radius:1cqw 1cqw .4cqw .4cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2.2cqw 0 1.8cqw;font:700 5cqw/1 var(--mono)}
.k-door i{width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--k-muted);align-self:flex-end;margin-right:1.8cqw}
.k-door:hover{border-color:var(--k-amber)}
.k-door.urinal{font:600 1.9cqw/1.3 var(--font);justify-content:center;flex-basis:13cqw}
.k-skip{align-self:center;background:none;border:1px solid var(--k-line);color:var(--k-text);border-radius:5cqw;padding:1.2cqw 3cqw;font-size:1.9cqw;font-weight:500}
.k-skip:hover{border-color:var(--k-muted)}
.k-sent{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.3cqw}
.k-check{width:11cqw;height:11cqw;border-radius:50%;background:rgba(242,176,30,.14);display:grid;place-items:center;color:var(--k-amber)}
.k-check .ico{width:6.2cqw;height:6.2cqw;stroke-width:3}
.k-check.dup{background:rgba(147,160,176,.16);color:var(--k-text)}
.k-sent h2{margin:0;font-size:3.9cqw}
.k-sent p{margin:0;font-size:2cqw;color:var(--k-muted)}
.k-sent .k-eta{color:var(--k-text)}
.k-sent .k-eta b{color:var(--k-amber);font-family:var(--mono)}
.k-track{list-style:none;display:flex;margin:1.4cqw 0 .8cqw;padding:0;width:84%}
.k-track li{flex:1;position:relative;padding-top:3.2cqw;font-size:1.7cqw;color:var(--k-muted)}
.k-track li::before{content:"";position:absolute;top:.4cqw;left:50%;transform:translateX(-50%);width:2cqw;height:2cqw;border-radius:50%;border:2px solid var(--k-line);background:var(--k-bg);z-index:1;box-sizing:border-box}
.k-track li::after{content:"";position:absolute;top:1.3cqw;left:-50%;width:100%;height:2px;background:var(--k-line);z-index:0}
.k-track li:first-child::after{display:none}
.k-track li.on{color:var(--k-text);font-weight:600}
.k-track li.on::before{background:var(--k-amber);border-color:var(--k-amber)}
.k-track li.on::after{background:var(--k-amber)}
.k-track time{display:block;font:500 1.5cqw var(--mono);color:var(--k-muted);min-height:1.2em}
.k-pulse{width:13cqw;height:13cqw;border-radius:50%;background:#B3261E;color:#fff;display:grid;place-items:center;animation:pulse 1.4s ease-out infinite}
.k-pulse .ico{width:6cqw;height:6cqw}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.6)}100%{box-shadow:0 0 0 4cqw rgba(179,38,30,0)}}
.k-thanks .ico{color:#7FD1A6}

/* ---------- QR 휴대폰 (고객) ---------- */
.qa{height:100%;display:flex;flex-direction:column;background:#F4F5F1;color:#18222F;position:relative;font-family:var(--font)}
.sbar{height:30px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font:600 12px var(--mono)}
.qa-top{background:#111A26;color:#F1F2EC}
.qa-head{display:flex;align-items:center;gap:10px;padding:8px 14px 14px}
.qa-floor{background:#F2B01E;color:#15110A;font:700 20px/1 var(--mono);padding:6px 7px 5px;border-radius:5px}
.qa-pict{width:26px;height:26px}
.qa-pict .ico{width:100%;height:100%}
.qa-where{display:flex;flex-direction:column;min-width:0;flex:1}
.qa-where b{font-size:15px;line-height:1.2}
.qa-where span{font-size:11px;color:#93A0B0}
.qa-lang{background:#1B2634;color:#F1F2EC;border:1px solid #2B3A4D;border-radius:6px;font-size:12px;padding:3px 4px;max-width:86px}
.qa-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.qa-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:#E4E8E1;border-radius:20px;padding:3px 10px 3px 8px;color:#3E4855}
.qa-chip .ico{width:14px;height:14px}
.qa-q{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;line-height:1.3}
.qa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa-grid .k-cell>.pen{top:4px;right:4px}
.qa-tile{width:100%;background:#fff;border:1px solid #DADFD6;border-radius:12px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;color:#18222F}
.qa-tile:active{background:#F0F2EC}
.qa-tile .ico{width:30px;height:30px;color:#A87200}
.qa-tile span{font-size:12px;font-weight:600;text-align:center;line-height:1.25}
.qa-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-clean,.qa-sos{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;text-align:left;border:1px solid #DADFD6;background:#fff;color:#18222F;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.qa-clean .ico{width:22px;height:22px;color:#2C8A5F}
.qa-sos{background:#FBE7E4;border-color:#F0B8B1;color:#8E1D16}
.qa-sos .ico{width:22px;height:22px}
.qa-sos small{font-size:10.5px}
.qa-sos.holding{color:#fff}

/* ---------- 담당자 앱 ---------- */

.card-t{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}

.ct-top{display:flex;align-items:center;gap:8px;min-width:0}

.st-banner{position:absolute;left:10px;right:10px;top:34px;z-index:7;background:var(--text);color:var(--surface);border:0;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:drop .35s ease-out;text-align:left;cursor:pointer}

@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.st-sheet-wrap{position:absolute;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;z-index:6}

.bsec{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:4px;font-size:12px}

.cell{position:relative;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:6px;min-height:38px;display:flex;align-items:center;gap:6px;padding:3px 8px;text-align:left;min-width:0}
.cell b{font:600 15px var(--mono)}

.cell.s-new{background:var(--new-bg);border-color:var(--new)}

button.cell:hover{outline:2px solid var(--text);outline-offset:-1px}
.ground{grid-column:1/-1;border-top:2px dashed var(--faint);margin:5px 0 3px;position:relative;height:0}
.ground span{position:absolute;right:0;top:-9px;background:var(--surface);font-size:10.5px;color:var(--muted);padding-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--muted);align-items:center}

.lg{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.lg.s-going{background:var(--going-bg);border-color:var(--going)}
.lg.s-over{background:var(--new);border-color:var(--new)}
.hchart{width:100%;height:auto;display:block}

.ins{list-style:none;margin:0;padding:0;display:grid;gap:12px}

.feed{list-style:none;margin:0;padding:0;display:grid}

.sticker{background:#fff;color:#18222F;border:1px solid #D3D8D0;border-radius:14px;overflow:hidden;display:grid;justify-items:center;gap:8px;padding-bottom:14px;width:min(100%,280px);margin:0 auto}

/* ---------- 화면 편집 팝오버 ---------- */
.pop{position:fixed;left:24px;top:80px;z-index:70;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.28);width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:10px;padding:0 14px 14px;max-height:calc(100vh - 24px);overflow:auto}
.pop>header{display:flex;align-items:center;gap:8px;padding:12px 0 2px}
.pop>header b{font-size:14px;white-space:nowrap}
.pop code{font:500 11px var(--mono);color:var(--muted);background:var(--surface-2);padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pop label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.pop label.pp-check{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500;font-size:13px}
.pop input[type=text],.pop textarea{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13.5px;width:100%;font-weight:400}
.pop textarea{resize:vertical}
.pop footer{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pop p{margin:0;font-size:13px}
.pp-row{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.memo-pop{width:min(480px,calc(100vw - 24px))}
.memo-list{width:min(540px,calc(100vw - 24px))}
.confirm-pop{width:min(360px,calc(100vw - 24px))}
.mp-ctx{font-size:12px;color:var(--muted)}
.mp-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mp-tools label.b{display:inline-flex;cursor:pointer;font-weight:500;color:var(--text);font-size:13px}
.mp-shots{display:flex;flex-wrap:wrap;gap:8px}
.mp-shots:empty{display:none}
.mp-shots figure{margin:0;position:relative;display:grid;gap:2px;font:500 10.5px var(--mono);color:var(--muted)}
.mp-shots img{width:104px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.mp-shots .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1}
.ml-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.ml-filter label{display:flex;align-items:center;gap:6px;font-weight:500;margin-left:auto}
.ml-items{display:grid;gap:10px}
.ml-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--ground)}
.ml-item.done{opacity:.55}
.ml-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.ml-text{margin:0;white-space:pre-wrap;font-size:13.5px}
.ml-shots{display:flex;gap:6px;flex-wrap:wrap}
.ml-shots img{width:88px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.ml-act{display:flex;gap:6px;justify-content:flex-end}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- v2: QR 전용 · 여러 기기 실시간 ---------- */
body.fullmode .topbar{display:none}
body.fullmode main{padding:0}
.full{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.full>.qa,.full>.st{flex:1;min-height:0}
.qa.is-full .qa-head{padding-top:14px}
.st.is-full .st-head{padding-top:10px}
.fab{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:65;border:1px solid #C9A400;background:var(--edit);color:var(--edit-ink);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;box-shadow:var(--shadow);opacity:.9}
.bsec{grid-template-columns:40px repeat(4,minmax(0,1fr))}
.bsec .hd small{display:block;font-weight:500;color:var(--faint);font-size:10.5px}
.try{display:grid;gap:10px}
.try-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.try figure{margin:0;display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.4}
.try figure b{color:var(--text)}
.qrbox{width:128px;height:128px;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:114px!important;height:114px!important}
.room-pick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.room-pick select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:13px;color:var(--text)}
.loading{margin:auto;color:var(--muted);font-size:13px;text-align:center;padding:24px}
.qa .loading{color:#6B7582}
.demo-actions{display:flex;flex-wrap:wrap;gap:8px}
.st-tools{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.st-tools .chipbtn .ico{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.chipbtn.on{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.qa-sending{opacity:.6;pointer-events:none}
.store-note{font-size:11.5px;color:var(--muted)}
.store-note.bad{color:var(--new)}
.sticker-row{display:flex;gap:8px;flex-wrap:wrap}
.ov{grid-template-columns:352px 352px minmax(300px,1fr)}
@media (max-width:1150px){.ov{grid-template-columns:352px 352px}.ov-col.adm-live{grid-column:1/-1}}
@media (max-width:760px){.ov{grid-template-columns:minmax(0,1fr)}.ov .dev-phone{margin:0 auto}}
.qrbox .qr-fallback{width:114px;height:114px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* SpUI — (주)스페이스 공통: 팝업 끌어 옮기기 + 첨부 자료 원본 크기 보기 (RULES 규칙 16)
 * 판 20260926-0420 · 원본은 `팝업첨부-표준` 스킬. 프로그램 쪽에서 고치지 말고 스킬부터 고친 뒤 옮긴다.
 *
 * 넣는 법: 앱 스크립트 맨 앞에 이 파일 내용을 그대로 붙인다(또는 <script src="sp-ui.js">). 설정 없이 동작.
 *  팝업  — <dialog> · [role="dialog"] · [data-sp-popup] 의 제목 줄을 잡고 끈다.
 *          제목 줄 = [data-sp-drag-handle], 또는 팝업 바로 안의 header · h1~h3 · .modal-header 등.
 *          제목 줄이 없는 팝업은 SpUI.grip(팝업) 으로 잡는 띠(⠿)를 붙인다. 끌지 않을 팝업은 data-sp-fixed.
 *          <dialog> 는 닫으면 다음에 원래 자리에서 열린다. 직접 만든 팝업은 닫는 함수에서 SpUI.reset(팝업).
 *  첨부  — <img data-sp-zoom>, 또는 [data-sp-zoom] 상자 안의 <img> 를 누르면 원본 크기(화면 픽셀 1:1)로 본다.
 *          미리보기와 원본이 다르면 <img data-sp-src="원본 주소">.
 *          이미지가 아닌 파일은 <a data-sp-zoom href="원본"> — 새 탭으로 연다(PDF 는 브라우저 보기).
 */
(function () {
  'use strict';
  if (window.SpUI) return;

  var POPUP = 'dialog, [role="dialog"], [data-sp-popup]';
  var HANDLES = ['[data-sp-drag-handle]', '.sp-grip', ':scope > header', ':scope > h1', ':scope > h2', ':scope > h3',
    ':scope > form > header', ':scope > form > h2', ':scope > form > h3',
    '.modal-header', '.dialog-header', '.popup-header', '.popover-header', '.modal-title'].join(',');
  var NO_DRAG = 'input, textarea, select, button, a[href], label, [contenteditable]:not([contenteditable="false"]), [data-sp-no-drag]';
  var KEEP = 80;               // 끌어도 화면 안에 남기는 최소 폭(px)
  var IMG_EXT = /\.(png|jpe?g|gif|webp|bmp|avif|svg)([?#]|$)/i;

  var css = [
    ':is(dialog,[role="dialog"],[data-sp-popup]):not([data-sp-fixed]) > :is(header,h1,h2,h3),',
    ':is(dialog,[role="dialog"],[data-sp-popup]):not([data-sp-fixed]) > form > :is(header,h2,h3),',
    '[data-sp-drag-handle], .sp-grip,',
    ':is(dialog,[role="dialog"],[data-sp-popup]):not([data-sp-fixed]) :is(.modal-header,.dialog-header,.popup-header,.popover-header,.modal-title)',
    '{cursor:move; user-select:none; -webkit-user-select:none; touch-action:none}',
    'html.sp-dragging, html.sp-dragging * {cursor:move !important; user-select:none !important}',
    '.sp-grip{display:block; height:14px; line-height:14px; margin:-4px 0 4px; text-align:center; font-size:12px; color:#999}',
    'img[data-sp-zoom], [data-sp-zoom] img, a[data-sp-zoom]{cursor:zoom-in}',
    '.sp-zoom{position:fixed; inset:0; width:100vw; height:100vh; max-width:none; max-height:none; margin:0; padding:0; border:0;',
    ' background:rgba(18,18,18,.94); color:#eee; font:13px/1.4 system-ui,"Malgun Gothic",sans-serif}',
    '.sp-zoom[open]{display:flex; flex-direction:column}',
    '.sp-zoom::backdrop{background:rgba(0,0,0,.5)}',
    '.sp-zoom-bar{display:flex; align-items:center; gap:8px; padding:6px 10px; background:rgba(0,0,0,.55); flex:none}',
    '.sp-zoom-info{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}',
    '.sp-zoom-bar button, .sp-zoom-bar a{font:inherit; color:#eee; background:#333; border:1px solid #555; border-radius:4px; padding:3px 10px; cursor:pointer; text-decoration:none}',
    '.sp-zoom-bar button:hover, .sp-zoom-bar a:hover{background:#444}',
    '.sp-zoom-sc{flex:1; min-height:0; overflow:auto; display:flex; padding:12px; cursor:default}',
    '.sp-zoom-sc.sp-pan{cursor:grab} .sp-zoom-sc.sp-panning{cursor:grabbing}',
    '.sp-zoom-img{margin:auto; flex:none; display:block; max-width:none; max-height:none; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.5); cursor:zoom-out}',
    '.sp-zoom-fitmode .sp-zoom-img{cursor:zoom-in}',
    '.sp-zoom-sc.sp-pan .sp-zoom-img{cursor:grab} .sp-zoom-sc.sp-panning .sp-zoom-img{cursor:grabbing}'
  ].join('\n');

  function addStyle() {
    if (document.getElementById('sp-ui-style')) return;
    var st = document.createElement('style');
    st.id = 'sp-ui-style';
    st.textContent = css;
    (document.head || document.documentElement).appendChild(st);
  }

  function vw() { return document.documentElement.clientWidth || innerWidth; }
  function vh() { return document.documentElement.clientHeight || innerHeight; }

  /* ---------------- 팝업 끌어 옮기기 ---------------- */
  var moved = new Set();
  var drag = null;

  // 누른 곳이 제목 줄이면 그 제목 줄을, 팝업 자체의 윗 여백(제목 줄 높이까지)이면 팝업을 돌려준다.
  // 팝업 바깥(<dialog> 의 어두운 뒷배경)은 target 이 팝업이어도 좌표가 밖이라 제외된다.
  function handleOf(pop, target, x, y) {
    var hs = pop.querySelectorAll(HANDLES), first = null;
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].closest(POPUP) !== pop) continue;
      if (!first) first = hs[i];
      if (hs[i].contains(target)) return hs[i];
    }
    if (target === pop && x != null) {
      var r = pop.getBoundingClientRect();
      var bottom = first ? first.getBoundingClientRect().bottom : r.top + 24;
      if (x >= r.left && x <= r.right && y >= r.top && y <= bottom) return pop;
    }
    return null;
  }

  // 팝업을 지금 보이는 자리 그대로 화면 기준(left/top)으로 고정한다. transform 을 쓰지 않는다 —
  // 팝업에 transform 을 걸면 그 안의 position:fixed 팝오버 기준이 바뀐다.
  function pin(pop) {
    if (pop.hasAttribute('data-sp-moved')) return;
    var r = pop.getBoundingClientRect();
    pop.setAttribute('data-sp-moved', '');
    pop.setAttribute('data-sp-style', pop.getAttribute('style') || '');
    var s = pop.style;
    s.position = 'fixed'; s.margin = '0'; s.right = 'auto'; s.bottom = 'auto';
    s.transform = 'none'; s.translate = 'none';
    s.left = r.left + 'px'; s.top = r.top + 'px';
    var r2 = pop.getBoundingClientRect();
    if (Math.abs(r2.width - r.width) > 0.5) s.width = r.width + 'px';
    // 조상에 transform·filter 가 있어 fixed 기준이 화면이 아니면 차이만큼 보정
    if (Math.abs(r2.left - r.left) > 0.5) s.left = (2 * r.left - r2.left) + 'px';
    if (Math.abs(r2.top - r.top) > 0.5) s.top = (2 * r.top - r2.top) + 'px';
    moved.add(pop);
  }

  function reset(pop) {
    if (!pop || !pop.hasAttribute('data-sp-moved')) return;
    var old = pop.getAttribute('data-sp-style');
    if (old) pop.setAttribute('style', old); else pop.removeAttribute('style');
    pop.removeAttribute('data-sp-moved');
    pop.removeAttribute('data-sp-style');
    moved.delete(pop);
  }

  function place(pop, rectLeft, rectTop, r0, L0, T0) {
    var nl = Math.min(Math.max(rectLeft, KEEP - r0.width), vw() - KEEP);
    var nt = Math.min(Math.max(rectTop, 0), vh() - KEEP);
    pop.style.left = (L0 + nl - r0.left) + 'px';
    pop.style.top = (T0 + nt - r0.top) + 'px';
  }

  function keepInView(pop) {
    if (!pop.isConnected) { moved.delete(pop); return; }
    var r = pop.getBoundingClientRect();
    if (!r.width && !r.height) return;          // 숨겨진 팝업
    place(pop, r.left, r.top, r, parseFloat(pop.style.left) || 0, parseFloat(pop.style.top) || 0);
  }

  function onDown(e) {
    if (e.button !== 0 || !e.isPrimary) return;
    var t = e.target;
    if (!(t instanceof Element)) return;
    var pop = t.closest(POPUP);
    if (!pop || pop.hasAttribute('data-sp-fixed')) return;
    var h = handleOf(pop, t, e.clientX, e.clientY);
    if (!h) return;
    var nd = t.closest(NO_DRAG);
    if (nd && h.contains(nd)) return;           // 제목 줄 안의 ✕·입력칸은 그대로 눌린다
    var r = pop.getBoundingClientRect();
    if (r.width >= vw() - 2 && r.height >= vh() - 2) return;   // 전체 화면 팝업(폰)은 옮기지 않는다
    drag = { pop: pop, h: h, id: e.pointerId, x0: e.clientX, y0: e.clientY, on: false };
    e.preventDefault();                          // 글자 선택 방지
  }

  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!(e.buttons & 1)) { onUp(e); return; }   // 단추를 뗀 것을 놓쳤으면 끝낸다
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.on) {
      if (Math.abs(dx) + Math.abs(dy) < 3) return;
      pin(drag.pop);
      drag.r0 = drag.pop.getBoundingClientRect();
      drag.L0 = parseFloat(drag.pop.style.left) || 0;
      drag.T0 = parseFloat(drag.pop.style.top) || 0;
      drag.on = true;
      document.documentElement.classList.add('sp-dragging');
      try { drag.h.setPointerCapture(drag.id); } catch (x) { /* 무시 */ }
    }
    place(drag.pop, drag.r0.left + dx, drag.r0.top + dy, drag.r0, drag.L0, drag.T0);
  }

  var swallowUntil = 0;
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var was = drag.on;
    drag = null;                                 // 바로 끝낸다(타이머로 미루면 입력이 몰릴 때 팝업이 마우스를 더 따라간다)
    if (was) {
      document.documentElement.classList.remove('sp-dragging');
      swallowUntil = Date.now() + 400;           // 끈 직후의 click 한 번이 뒤 화면·닫기 처리로 새지 않게
    }
  }
  function guardClick(e) {
    if (swallowUntil && Date.now() < swallowUntil) { swallowUntil = 0; e.stopPropagation(); e.preventDefault(); }
  }

  function onDbl(e) {
    var t = e.target;
    if (!(t instanceof Element) || t.closest(NO_DRAG)) return;
    var pop = t.closest(POPUP);
    if (pop && handleOf(pop, t, e.clientX, e.clientY)) reset(pop);    // 제목 줄 두 번 누르면 원래 자리
  }

  function grip(pop) {
    if (!pop || pop.querySelector(':scope > .sp-grip')) return;
    var g = document.createElement('div');
    g.className = 'sp-grip';
    g.title = '끌어서 옮기기';
    g.textContent = '⠿';
    pop.insertBefore(g, pop.firstChild);
  }

  /* ---------------- 첨부 자료 원본 크기 보기 ---------------- */
  var Z = null;

  function zoomUI() {
    if (Z && Z.d.isConnected) return Z;
    var d = document.createElement('dialog');
    d.className = 'sp-zoom';
    d.setAttribute('data-sp-fixed', '');
    d.setAttribute('aria-label', '원본 크기 보기');
    d.innerHTML =
      '<div class="sp-zoom-bar">' +
      '<span class="sp-zoom-info"></span>' +
      '<button type="button" class="sp-zoom-prev" title="이전 (←)">◀</button>' +
      '<button type="button" class="sp-zoom-next" title="다음 (→)">▶</button>' +
      '<button type="button" class="sp-zoom-fit"></button>' +
      '<a class="sp-zoom-open" target="_blank" rel="noopener">새 탭에서 원본</a>' +
      '<button type="button" class="sp-zoom-x" title="닫기 (Esc)">✕ 닫기</button>' +
      '</div><div class="sp-zoom-sc"><img class="sp-zoom-img" alt=""></div>';
    document.body.appendChild(d);
    Z = { d: d, sc: d.querySelector('.sp-zoom-sc'), img: d.querySelector('.sp-zoom-img'),
      info: d.querySelector('.sp-zoom-info'), fitBtn: d.querySelector('.sp-zoom-fit'),
      open: d.querySelector('.sp-zoom-open'), prev: d.querySelector('.sp-zoom-prev'),
      next: d.querySelector('.sp-zoom-next'), list: [], i: 0, fit: false, pan: null };

    d.querySelector('.sp-zoom-x').onclick = function () { d.close(); };
    Z.fitBtn.onclick = function () { Z.fit = !Z.fit; layout(); };
    Z.prev.onclick = function () { go(-1); };
    Z.next.onclick = function () { go(1); };
    d.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
    });
    d.addEventListener('close', function () { Z.img.removeAttribute('src'); Z.list = []; });

function statusChip(t) {
  if (t.status === 'cancel') return '<span class="chip cancel">취소</span>';
  if (t.status === 'done') return '<span class="chip done">완료</span>';
  if (t.emergency && t.status === 'new') return '<span class="chip sos">긴급</span>';
  return t.status === 'going' ? '<span class="chip going">처리 중</span>' : '<span class="chip new">대기</span>';
}
const elapsedText = ms => { const m = Math.floor(ms / M); return m < 1 ? '방금' : m + '분'; };
function lvlOf(t) { if (!isOpen(t)) return ''; const d = Date.now() - t.createdAt, sla = issueDef(t.issue).sla * M; return d >= sla ? 'over' : d >= sla * 0.7 ? 'warn' : ''; }
function elapsedSpan(t, cls = '') {
  if (t.status === 'done') return `<span class="${cls} mono">${mins(t.doneAt - t.createdAt)}분${isOver(t) ? ' <span class="over">초과</span>' : ''}</span>`;
  if (t.status === 'cancel') return `<span class="${cls} mono hint">—</span>`;
  return `<span class="${cls} mono ${lvlOf(t)}" data-elapsed="${t.createdAt}" data-sla="${issueDef(t.issue).sla}">${elapsedText(Date.now() - t.createdAt)}</span>`;
}
function renderQRCode(box, text, size) {

  box.innerHTML = '<div class="qr-fallback">QR</div>';
}

function bindSos(el, st, ctx) {
  const b = el.querySelector('[data-act="sos"]'); if (!b) return;
  let tm = null;
  const stop = () => { clearTimeout(tm); tm = null; b.classList.remove('holding'); };
  b.addEventListener('pointerdown', e => { if (e.button !== 0) return; b.classList.add('holding'); tm = setTimeout(() => { stop(); triggerSos(ctx); }, 2000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('contextmenu', e => e.preventDefault());
}

function mountQR(el, ctx) {
  if (QS.roomId !== ctx.roomId) { QS.roomId = ctx.roomId; resetQS(); QS.lang = 'ko'; QS.pendingLast = LS.get('rc-last-' + ctx.roomId); }
  QS.el = el; QS.ctx = ctx;
  const draw = () => {
    if (QS.el !== el) return;
    if (QS.step === 'home' && QS.pendingLast && DATA_READY) {
      const t = tById(QS.pendingLast); QS.pendingLast = null;
      if (t && (isOpen(t) || (t.status === 'done' && Date.now() - t.doneAt < 30 * M))) { QS.res = { tid: t.id, dup: false }; QS.step = 'sent'; }
    }
    el.innerHTML = qrHTML(ctx);
    bindSos(el, QS, ctx);
    S.openPopup = QS.step === 'detail' ? 'qrSheet' : (S.openPopup === 'qrSheet' ? '' : S.openPopup);
  };
  QS.draw = draw;
  el.onclick = e => qrClick(e, ctx);
  el.onchange = e => qrChange(e);
  el.oninput = e => { if (e.target.dataset.in === 'qnote') QS.note = e.target.value.slice(0, 200); };
  draw();
  MOUNTS.push({ refresh: () => { if (QS.el === el && (QS.step === 'sent' || QS.step === 'sos' || (QS.step === 'home' && QS.pendingLast))) draw(); } });
}

async function triggerSos(ctx) {
  try {

    QS.res = { tid: r.id, dup: false }; QS.step = 'sos'; LS.set('rc-last-' + ctx.roomId, r.id); QS.draw();
  } catch (e) { toast(T(QS.lang, 'sendFail')); QS.step = 'home'; QS.draw(); }

async function qrClick(e, ctx) {
  const b = e.target.closest('button'); if (!b || b.classList.contains('pen')) return;
  if (b.dataset.issue) { QS.issue = b.dataset.issue; QS.stall = null; QS.msg = ''; QS.step = 'detail'; QS.draw(); return; }
  if (b.dataset.qstall) { QS.stall = b.dataset.qstall === '?' ? null : (b.dataset.qstall === 'U' ? 'U' : +b.dataset.qstall); $$('[data-qstall]', QS.el).forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
  const act = b.dataset.act;
  if (act === 'home') { if (QS.purl) URL.revokeObjectURL(QS.purl); QS.purl = null; QS.pblob = null; QS.step = 'home'; QS.res = null; QS.msg = ''; QS.note = ''; QS.draw(); }
  else if (act === 'rmphoto') { if (QS.purl) URL.revokeObjectURL(QS.purl); QS.purl = null; QS.pblob = null; QS.draw(); }
  else if (act === 'send') {
    if (QS.sending) return;
    QS.sending = true; QS.msg = ''; QS.draw();

function hourSVG() {
  const now = Date.now(), H0 = kstHour(now);
  const hours = []; for (let i = 9; i >= 0; i--) hours.push((H0 - i + 24) % 24);
  const cnt = hours.map(() => 0);
  TICKETS.forEach(t => { if (t.status === 'cancel' || now - t.createdAt > 10 * 3600e3) return; const idx = hours.indexOf(kstHour(t.createdAt)); if (idx >= 0) cnt[idx]++; });

  const max = Math.max(1, ...cnt), peak = cnt.indexOf(Math.max(...cnt));
  let g = `<svg class="hchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="시간대별 접수: ${hours.map((h, i) => h + '시 ' + cnt[i] + '건').join(', ')}">`;
  hours.forEach((h, i) => {

    g += `<rect class="bar${i === peak && cnt[i] ? ' peak' : ''}${i === 9 ? ' now' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${bh.toFixed(1)}" rx="3"/>`;
    if (cnt[i]) g += `<text class="val" x="${(x + bw * 0.3).toFixed(1)}" y="${(y - 7).toFixed(1)}" text-anchor="middle">${cnt[i]}</text>`;
    g += `<text class="lab" x="${(x + bw * 0.3).toFixed(1)}" y="${H - 8}" text-anchor="middle">${h}시</text>`;
  });
  g += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/></svg>`;
  return g + `<p class="hint" style="margin:6px 0 0">최근 10시간${cnt[peak] ? ` · 가장 많은 때 <b>${hours[peak]}시 ${cnt[peak]}건</b>` : ''} · 맨 오른쪽 막대는 지금 시간대라 아직 차는 중입니다</p>`;

    ${group ? '<div class="pp-row">순서<button type="button" class="b" data-pp="up">▲ 앞으로</button><button type="button" class="b" data-pp="down">▼ 뒤로</button></div>' : ''}
    ${locked ? '<p class="hint">식별·계산에 쓰는 칸이라 숨길 수 없습니다. 이름만 바꿀 수 있습니다.</p>' : `<label class="pp-check"><input type="checkbox" id="ppHide" ${ui.hidden[key] ? 'checked' : ''}>이 항목 숨기기</label>`}
    <label>도움말<textarea id="ppHelp" rows="2" maxlength="300" placeholder="보는 사람에게 보여 줄 짧은 설명">${esc(ui.help[key] || '')}</textarea></label>
    <footer><button type="button" class="b" data-pp="memo">이 항목 메모</button><span class="grow"></span><button type="button" class="b primary" data-pp="save">저장</button></footer>`;
  showPop(pop, btn.getBoundingClientRect());
  $('#ppName').focus();
}
function movePen(dir) {
  if (!PEN || !PEN.group || !GROUPS[PEN.group]) return;
  const keys = ordered(GROUPS[PEN.group]);
  const i = keys.indexOf(PEN.key), j = i + dir;
  if (i < 0 || j < 0 || j >= keys.length) return;
  [keys[i], keys[j]] = [keys[j], keys[i]];
  keys.forEach((k, idx) => { ui.order[k] = idx; });
  saveUI(); rerender();
}
function rerender() { render(); if (DETAIL_OPEN) drawDetail(); }
$('#penPop').addEventListener('click', e => {
  const b = e.target.closest('[data-pp]'); if (!b || !PEN) return;
  const k = PEN.key, a = b.dataset.pp;
  if (a === 'close') closePop('penPop');
  else if (a === 'up') movePen(-1);
  else if (a === 'down') movePen(1);
  else if (a === 'memo') { const lab = L(k); closePop('penPop'); openMemo({ key: k, label: lab }); }
  else if (a === 'save') {
    const n = $('#ppName').value.trim().slice(0, 300); if (n) ui.labels[k] = n; else delete ui.labels[k];
    const h = $('#ppHide'); if (h) { if (h.checked) ui.hidden[k] = true; else delete ui.hidden[k]; }
    const hp = $('#ppHelp').value.trim().slice(0, 300); if (hp) ui.help[k] = hp; else delete ui.help[k];
    saveUI(); closePop('penPop'); rerender(); toast('화면을 바꿨습니다');
  }
});

let MEMO = null;
function openMemo(ctx = {}) {
  MEMO = { key: ctx.key || '', label: ctx.label || '', shots: [], page: curScreen(), pageName: screenName(), target: S.openPopup || '' };
  const pop = $('#memoPop');
  pop.innerHTML = `<header><b>화면 메모</b><button type="button" class="x" data-mp="close" aria-label="닫기">✕</button></header>
    <div class="mp-ctx">화면: ${esc(MEMO.pageName)}${MEMO.target ? ' · 창: ' + esc(MEMO.target) : ''}${MEMO.label ? ' · 항목: ' + esc(MEMO.label) : ''}</div>
    <textarea id="mpText" rows="6" maxlength="2000" placeholder="고칠 점을 적어 주세요. 여러 줄로 써도 됩니다." aria-label="메모 내용"></textarea>
    <div class="mp-tools"><button type="button" class="b" data-mp="cap">📷 화면 캡처</button><label class="b">🖼 이미지 파일<input type="file" id="mpFile" accept="image/*" multiple hidden></label><span class="hint">Ctrl+V로 붙여넣기도 됩니다</span></div>
    <div class="mp-shots" id="mpShots" data-sp-zoom></div>
    <footer><span class="hint grow" id="mpMsg"></span><button type="button" class="b" data-mp="close">취소</button><button type="button" class="b primary" data-mp="save" id="mpSave">메모 저장</button></footer>`;
  showPop(pop, null);
  $('#mpText').focus();
  $('#mpFile').onchange = async e => { for (const f of Array.from(e.target.files || [])) await addShot(f, 'file', f.name); e.target.value = ''; };
}
const mpMsg = s => { const m = $('#mpMsg'); if (m) m.textContent = s; };
async function addShot(blob, kind, name) {
  if (!MEMO) return;
  if (MEMO.shots.length >= 10) { mpMsg('캡처는 10장까지 넣을 수 있습니다'); return; }
  try {
    let url = URL.createObjectURL(blob), img = await loadImg(url);
    if (!['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(blob.type)) {
      const c0 = document.createElement('canvas'); c0.width = img.naturalWidth; c0.height = img.naturalHeight; c0.getContext('2d').drawImage(img, 0, 0);
      blob = await canvasBlob(c0, 'image/png'); URL.revokeObjectURL(url); url = URL.createObjectURL(blob); img = await loadImg(url);
    }
    const w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 240 / w);
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    MEMO.shots.push({ blob, url, name: name || ('이미지_' + Date.now() + '.png'), mime: blob.type, kind, bytes: blob.size, at: new Date().toISOString(), w, h, thumb: c.toDataURL('image/jpeg', 0.62) });
    drawShots(); mpMsg('');
  } catch (e) { mpMsg('이미지를 읽지 못했습니다'); }
}
function drawShots() {
  const box = $('#mpShots'); if (!box || !MEMO) return;
  box.innerHTML = MEMO.shots.map((s, i) => `<figure><img src="${s.url}" alt="${esc(s.name)}"><button type="button" class="rm" data-rm="${i}" aria-label="빼기">✕</button><figcaption>${s.w}×${s.h}</figcaption></figure>`).join('');
}
async function captureScreen() {
  if (typeof window.html2canvas !== 'function') { mpMsg('화면 캡처 도구를 불러오지 못했습니다. 이미지 파일이나 붙여넣기를 써 주세요.'); return; }
  const pop = $('#memoPop');
  mpMsg('캡처하는 중…');
  pop.style.visibility = 'hidden';
  try {
    const canvas = await window.html2canvas(document.body, {
      x: scrollX, y: scrollY, width: innerWidth, height: innerHeight, scale: window.devicePixelRatio || 1, useCORS: true, logging: false,
      backgroundColor: getComputedStyle(document.body).backgroundColor,
      ignoreElements: el => el.id === 'memoPop' || (el.classList && el.classList.contains('sp-zoom'))
    });
    const blob = await canvasBlob(canvas, 'image/png');
    const o = kst(Date.now());
    await addShot(blob, 'capture', `화면캡처_${o.year}${o.month}${o.day}-${o.hour}${o.minute}.png`);
  } catch (e) { mpMsg('캡처하지 못했습니다. 이미지 파일이나 붙여넣기를 써 주세요.'); }
  finally { pop.style.visibility = ''; }
}
async function saveMemo() {
  if (!MEMO) return;
  const text = $('#mpText').value.trim().slice(0, 2000);
  if (!text && !MEMO.shots.length) { mpMsg('내용을 적거나 캡처를 넣어 주세요'); return; }
  if (NOTES.length >= 500) { mpMsg('메모가 500건을 넘었습니다. 완료한 메모를 지운 뒤 저장해 주세요.'); return; }
  const btn = $('#mpSave'); btn.disabled = true; mpMsg('저장하는 중…');
  const shots = [];
  for (const s of MEMO.shots) {
    let file = null;
    if (ASSETS) { try { const r = await ASSETS.upload(s.blob, { type: s.mime }); file = r.id; } catch (e) { /* 원본은 이 창에만 */ } }
    if (!file) LOCALSHOT.set(s.at + s.name, s.url);
    shots.push({ file, name: s.name, mime: s.mime, kind: s.kind, bytes: s.bytes, at: s.at, w: s.w, h: s.h, thumb: s.thumb });
  }
  const memo = { id: uuid(), at: new Date().toISOString(), build: BUILD, page: MEMO.page, pageName: MEMO.pageName, scope: MEMO.page.split('.')[0], target: MEMO.target, key: MEMO.key, label: MEMO.label, text, shots, done: false, dev: DEVICE };
  if (DB) {
    try { await DB.collection('notes').doc(memo.id).set(memo); }
    catch (e) { btn.disabled = false; mpMsg('저장하지 못했습니다 (' + errCode(e) + '). 다시 눌러 주세요.'); return; }
  } else NOTES.unshift(memo);
  closePop('memoPop'); updateEditbar(); drawMemoList();
  toast(shots.some(s => !s.file) && DB ? '메모를 저장했습니다. 캡처 원본은 이 창에만 남았습니다.' : '화면 메모를 저장했습니다');
}
$('#memoPop').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm && MEMO) { const i = +rm.dataset.rm; const s = MEMO.shots[i]; if (s) URL.revokeObjectURL(s.url); MEMO.shots.splice(i, 1); drawShots(); return; }
  const b = e.target.closest('[data-mp]'); if (!b) return;
  if (b.dataset.mp === 'close') closePop('memoPop');
  else if (b.dataset.mp === 'cap') captureScreen();
  else if (b.dataset.mp === 'save') saveMemo();
});
document.addEventListener('paste', e => {
  if ($('#memoPop').hidden || !MEMO) return;
  const items = Array.from((e.clipboardData && e.clipboardData.items) || []).filter(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault();
  items.forEach(i => { const f = i.getAsFile(); if (f) addShot(f, 'paste', '붙여넣기_' + Date.now() + '.' + (f.type.split('/')[1] || 'png')); });
});
const ML = { f: 'page', showDone: false };
const shotSrc = s => s.file ? '/_blob/' + s.file : (LOCALSHOT.get(s.at + s.name) || s.thumb || '');
function openMemoList() {
  const pop = $('#memoList');
  pop.innerHTML = `<header><b>화면 메모</b><span class="hint" id="mlCount"></span><button type="button" class="x" data-ml="close" aria-label="닫기">✕</button></header>
    <div class="ml-filter"><button type="button" class="chipbtn" data-mlf="page" aria-pressed="${ML.f === 'page'}">이 화면</button><button type="button" class="chipbtn" data-mlf="all" aria-pressed="${ML.f === 'all'}">전체</button><label><input type="checkbox" id="mlDone" ${ML.showDone ? 'checked' : ''}>완료 표시한 것도 보기</label></div>
    <div class="ml-items" id="mlItems"></div>`;
  showPop(pop, null);
  $('#mlDone').onchange = e => { ML.showDone = e.target.checked; drawMemoList(); };
  drawMemoList();
}
function drawMemoList() {
  const pop = $('#memoList'); if (pop.hidden) return;
  const box = $('#mlItems'); if (!box) return;
  let list = NOTES.filter(n => ML.showDone || !n.done);
  if (ML.f === 'page') list = list.filter(n => n.page === curScreen());
  $('#mlCount').textContent = `· 남은 메모 ${activeNotes().length}개`;
  box.innerHTML = list.length ? list.map(n => `<article class="ml-item${n.done ? ' done' : ''}" data-nid="${esc(n.id)}">
      <div class="ml-meta"><span class="mono">${fmtDT(n.at)}</span><span>${esc(n.pageName || n.page)}</span>${n.target ? `<span>창: ${esc(n.target)}</span>` : ''}${n.label ? `<span>항목: ${esc(n.label)}</span>` : ''}<span class="mono">판 ${esc(n.build || '')}</span></div>
      ${n.text ? `<p class="ml-text">${esc(n.text)}</p>` : ''}
      ${n.shots && n.shots.length ? `<div class="ml-shots" data-sp-zoom>${n.shots.map(s => `<img src="${esc(s.thumb || shotSrc(s))}" data-sp-src="${esc(shotSrc(s))}" alt="${esc(s.name)}" title="${s.w}×${s.h}">`).join('')}</div>` : ''}
      <div class="ml-act"><button type="button" class="b" data-ma="done">${n.done ? '되살리기' : '완료 표시'}</button><button type="button" class="b danger" data-ma="del">지우기</button></div>
    </article>`).join('') : `<p class="hint">${ML.f === 'page' ? '이 화면에 남긴 메모가 없습니다.' : '남긴 메모가 없습니다.'}</p>`;
}
$('#memoList').addEventListener('click', async e => {
  const f = e.target.closest('[data-mlf]');
  if (f) { ML.f = f.dataset.mlf; $$('[data-mlf]').forEach(x => x.setAttribute('aria-pressed', String(x === f))); drawMemoList(); return; }
  if (e.target.closest('[data-ml="close"]')) { closePop('memoList'); return; }
  const b = e.target.closest('[data-ma]'); if (!b) return;
  const item = b.closest('[data-nid]'), n = NOTES.find(x => x.id === item.dataset.nid); if (!n) return;
  if (b.dataset.ma === 'done') {
    if (DB) { try { await DB.doc('notes/' + n.id).update({ done: !n.done }); } catch (err) { toast('바꾸지 못했습니다'); } }
    else { n.done = !n.done; drawMemoList(); updateEditbar(); }
  } else if (b.dataset.ma === 'del') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = '정말 지우기'; setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = '지우기'; } }, 4000); return; }
    if (DB) {
      try { await DB.doc('notes/' + n.id).delete(); } catch (err) { toast('지우지 못했습니다'); return; }
      if (ASSETS) for (const s of (n.shots || [])) { if (s.file) { try { await ASSETS.delete(s.file); } catch (err) { /* 무시 */ } } }
    } else { NOTES = NOTES.filter(x => x !== n); drawMemoList(); updateEditbar(); }
  }
});
async function exportNotes() {
  const data = JSON.stringify({ exported_at: new Date().toISOString(), build: BUILD, ui, notes: NOTES }, null, 2);
  if (!DL) { toast('이 보기에서는 파일 저장이 안 됩니다. 메모는 Claude가 저장소에서 바로 읽습니다.'); return; }
  try { await DL.save({ filename: '화면메모_' + kstDate() + '.json', data }); } catch (e) { if (e && e.code !== 'declined') toast('내보내지 못했습니다 (' + errCode(e) + ')'); }
}
function resetKeys(pred) { ['labels', 'hidden', 'order', 'help'].forEach(p => { Object.keys(ui[p]).forEach(k => { if (pred(k)) delete ui[p][k]; }); }); saveUI(); rerender(); }

/* ================= 이벤트 연결 ================= */
document.addEventListener('click', e => { const p = e.target.closest('.pen'); if (p) { e.preventDefault(); e.stopPropagation(); openPen(p); } }, true);
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v && !e.target.closest('.pen')) { S.view = v.dataset.view; S.full = null; closeDetail(); render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.sp-zoom[open]')) return;
  for (const id of ['confirmPop', 'penPop', 'memoPop', 'memoList']) { const p = $('#' + id); if (!p.hidden) { if (id === 'confirmPop') { const c = p.querySelector('[data-c="0"]'); if (c) c.click(); } else closePop(id); return; } }
  if (DETAIL_OPEN) closeDetail();
});
$('#editToggle').onchange = e => setEditing(e.target.checked);
$('#fab').onclick = () => setEditing(!S.editing);
$('#ebOff').onclick = () => setEditing(false);
$('#ebMemo').onclick = () => openMemo({});
$('#ebList').onclick = () => openMemoList();
$('#ebExport').onclick = () => exportNotes();
$('#ebResetScreen').onclick = () => askConfirm(`‘${screenName()}’ 화면의 이름·순서·숨김·도움말을 처음 상태로 돌릴까요? 메모는 남습니다.`, '처음 상태로').then(ok => { if (ok) { const cur = curScreen(); resetKeys(k => KEYREG[k] && KEYREG[k].has(cur)); toast('이 화면을 처음 상태로 돌렸습니다'); } });
$('#ebResetAll').onclick = () => askConfirm('모든 화면의 이름·순서·숨김·도움말을 처음 상태로 돌릴까요? 메모는 남습니다.', '전체 처음 상태로').then(ok => { if (ok) { resetKeys(() => true); toast('전체를 처음 상태로 돌렸습니다'); } });
window.addEventListener('hashchange', route);
setInterval(() => {
  const now = Date.now();
  $$('[data-elapsed]').forEach(el => { const c = +el.dataset.elapsed, sla = +el.dataset.sla * M, d = now - c; el.textContent = elapsedText(d); el.classList.toggle('warn', d >= sla * 0.7 && d < sla); el.classList.toggle('over', d >= sla); });
}, 5000);
setInterval(() => dispatch([]), 60000);

/* ================= 시작 ================= */
$('#buildNo').textContent = BUILD;
route();
(async function initStore() {
  let got = [null, null, null];
  if (window.claude && typeof window.claude.use === 'function') {
    try { got = await Promise.all([window.claude.use('db'), window.claude.use('assets'), window.claude.use('downloads')]); } catch (e) { /* 없는 채로 */ }
  }
  DB = got[0]; ASSETS = got[1]; DL = got[2];
  STORE = DB ? 'on' : 'off';
  if (!DB) {
    TICKETS = genDemo(); FEEDBACK = demoFeedback(); DATA_READY = true;
    updateEditbar(); dispatch([]);
    return;
  }
  updateEditbar();
  DB.doc('config/ops').onSnapshot(s => { applyOps(s.exists ? s.data() : null); dispatch([]); if (S.view === 'admin' && AS.sub === 'settings' && AS.el) drawAdmMain(); }, () => {});
  DB.doc('config/ui').onSnapshot(s => {
    if (uiSaving || uiDirty || (s.metadata && s.metadata.hasPendingWrites)) return;
    const next = normUI(s.exists ? s.data() : null);
    if (JSON.stringify(next) !== JSON.stringify(ui)) { ui = next; rerender(); }
  }, () => {});
  DB.collection('tickets').orderBy('createdAt', 'desc').limit(600).onSnapshot(q => {
    const next = q.docs.map(d => d.data());
    const ev = DATA_READY ? diffEvents(TICKETS, next) : [];
    TICKETS = next; DATA_READY = true;
    dispatch(ev);
  }, () => { STORE = 'off'; updateEditbar(); toast('접수 기록을 불러오지 못했습니다. 새로 고쳐 주세요.'); });
  DB.collection('feedback').onSnapshot(q => {
    const f = {}, day = kstDate();
    q.docs.forEach(d => { const x = d.data(); if (x.day === day) f[x.roomId] = x.n || 0; });
    FEEDBACK = f; dispatch([]);
  }, () => {});
  DB.collection('notes').orderBy('at', 'desc').limit(500).onSnapshot(q => {
    NOTES = q.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    updateEditbar(); drawMemoList();
  }, () => {});
})();
})();
</script>
